<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo de Decretos Masónicos - Rito de Menfis-Misraïm</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --container-bg: #1f2833;
            --gold-primary: #c5a059;
            --gold-light: #e5c583;
            --text-color: #c5c6c7;
            --text-title: #ffffff;
            --border-color: #45a29e;
            --danger-color: #ff4d4d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px double var(--gold-primary);
            padding-bottom: 20px;
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold-primary);
            font-size: 2.5rem;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.3);
        }

        .subtitle {
            font-size: 1.4rem;
            font-style: italic;
            color: var(--text-title);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 1200px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-bar {
            background-color: #151a21;
            border: 1px solid var(--gold-primary);
            color: var(--text-title);
            padding: 10px 15px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            border-radius: 4px;
            width: 300px;
            outline: none;
        }

        .search-bar:focus {
            box-shadow: 0 0 5px var(--gold-light);
        }

        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background-color: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 10px 20px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: var(--gold-primary);
            color: var(--bg-color);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.4);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background-color: var(--container-bg);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 8px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(197, 160, 89, 0.15);
            border-color: var(--gold-primary);
        }

        .card::before {
            content: "∴";
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.8rem;
            color: var(--gold-primary);
        }

        .card-header {
            margin-bottom: 15px;
        }

        .card-number {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 1.1rem;
            font-weight: bold;
        }

        .card-title {
            color: var(--text-title);
            font-size: 1.4rem;
            margin: 5px 0;
            font-weight: 600;
        }

        .card-body {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .card-meta {
            font-size: 0.95rem;
            color: #8892b0;
            border-top: 1px solid rgba(197, 160, 89, 0.1);
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        .card-badge {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 3px;
            margin-top: 5px;
            font-weight: bold;
        }

        .badge-santuario {
            background-color: rgba(197, 160, 89, 0.15);
            color: var(--gold-light);
            border: 1px solid var(--gold-primary);
        }

        .badge-fazio {
            background-color: rgba(69, 162, 158, 0.15);
            color: #66fcf1;
            border: 1px solid var(--border-color);
        }

        .read-btn {
            background-color: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 8px 15px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            margin-top: 15px;
            align-self: flex-start;
        }

        .read-btn:hover {
            background-color: var(--gold-primary);
            color: var(--bg-color);
            font-weight: bold;
        }

        /* Modal style */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #1a1a24;
            border: 2px solid var(--gold-primary);
            border-radius: 12px;
            max-width: 700px;
            width: 90%;
            max-height: 80%;
            overflow-y: auto;
            padding: 40px;
            box-shadow: 0 0 25px var(--gold-primary);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: var(--gold-primary);
            font-size: 2rem;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: var(--gold-light);
        }

        .modal-text {
            font-size: 1.15rem;
            line-height: 1.6;
            white-space: pre-wrap;
            color: var(--text-color);
        }

        .modal-text h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold-primary);
            text-align: center;
            margin-top: 0;
        }

        .modal-text h4 {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            text-align: center;
        }

        /* Sello Masónico */
        .seal {
            text-align: center;
            margin: 20px 0;
            font-size: 2rem;
            color: var(--gold-primary);
            font-family: 'Cinzel', serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #111;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gold-primary);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="seal">∴</div>
        <h1>ARCHIVO LEGISLATIVO MASÓNICO</h1>
        <div class="subtitle">Rito Antiguo y Primitivo de Menfis-Misraïm para la República del Paraguay</div>
    </header>

    <div class="controls">
        <input type="text" class="search-bar" id="search" placeholder="Buscar por título, contenido o número..." onkeyup="filterDecrets()">
        <div class="tabs">
            <button class="tab-btn active" id="btn-all" onclick="filterTab('all')">Todos</button>
            <button class="tab-btn" id="btn-santuario" onclick="filterTab('santuario')">Soberano Santuario</button>
            <button class="tab-btn" id="btn-fazio" onclick="filterTab('fazio')">Edgar Fazio 95°</button>
        </div>
    </div>

    <div class="grid-container" id="decrees-grid">
        <!-- Cards will be populated by JS -->
    </div>

    <!-- Modal Lector -->
    <div class="modal" id="reader-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal(null)">&times;</span>
            <div class="modal-text" id="modal-body">
                <!-- Text populated by JS -->
            </div>
        </div>
    </div>

        function displayDecrees(data) {
            const container = document.getElementById('decrees-grid');
            container.innerHTML = '';
            data.forEach(d => {
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-emitter', d.emitter);
                
                const badgeClass = d.emitter === 'santuario' ? 'badge-santuario' : 'badge-fazio';

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-number">${d.number}</div>
                        <span class="card-badge ${badgeClass}">${d.emitterText}</span>
                        <div class="card-title">${d.title}</div>
                    </div>
                    <div class="card-body">
                        ${d.desc}
                    </div>
                    <div>
                        <div class="card-meta">
                            <span>Fecha: ${d.date}</span>
                            <span>${d.valley}</span>
                        </div>
                        <button class="read-btn" onclick="openModal('${d.id}')">Leer Plancha</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        let currentTab = 'all';

        function filterTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${tab}`).classList.add('active');
            filterDecrets();
        }

        function filterDecrets() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = decrees.filter(d => {
                const matchesTab = currentTab === 'all' || d.emitter === currentTab;
                const matchesQuery = d.number.toLowerCase().includes(query) || 
                                     d.title.toLowerCase().includes(query) || 
                                     d.desc.toLowerCase().includes(query) ||
                                     d.content.toLowerCase().includes(query);
                return matchesTab && matchesQuery;
            });
            displayDecrees(filtered);
        }

        function openModal(id) {
            const decree = decrees.find(d => d.id === id);
            const body = document.getElementById('modal-body');
            
            // Convert markdown simple layout to HTML
            let htmlText = decree.content
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/### (.*?)\n/g, '<h3>$1</h3>')
                .replace(/## (.*?)\n/g, '<h2>$1</h2>');
            
            body.innerHTML = `
                <div class="seal">∴</div>
                ${htmlText}
                <div class="seal">∴</div>
            `;
            
            document.getElementById('reader-modal').style.display = 'flex';
        }

        function closeModal(event) {
            if (!event || event.target.id === 'reader-modal' || event.target.className === 'close-btn') {
                document.getElementById('reader-modal').style.display = 'none';
            }
        }

        // Initialize
        displayDecrees(decrees);
    </script>
</body>
</html>
